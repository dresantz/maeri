<!-- =========================
     Spells Modal
========================= -->

<div id="spells-overlay" class="spells-overlay"></div>

<div id="spells-modal" class="spells-modal">
  
  <div class="spells-header">
    <h2>Magias</h2>
    <div class="spells-header-actions">
      <button id="spells-to-sheet" class="spells-quick-btn" title="Abrir Ficha">📋</button>
      <button id="spells-to-dice" class="spells-quick-btn" title="Abrir Dados">🎲</button>
      <button id="spells-close" class="spells-close">✕</button>
    </div>
  </div>

  <div class="spells-toolbar">
    <input type="search" id="spells-search" placeholder="Buscar magia...">
    
    <!-- 🔹 NOVOS FILTROS -->
    <div class="spells-filters">
      <div class="filter-group">
        <button class="filter-toggle" data-filter="school">Escola ▼</button>
        <div class="filter-options school-options" style="display: none;">
          <label><input type="checkbox" data-school="neofita"> Neófita</label>
          <label><input type="checkbox" data-school="bruxaria"> Bruxaria</label>
          <label><input type="checkbox" data-school="divinacao"> Divinação</label>
          <label><input type="checkbox" data-school="feiticaria"> Feitiçaria</label>
        </div>
      </div>

      <div class="filter-group">
        <button class="filter-toggle" data-filter="level">Nível ▼</button>
        <div class="filter-options level-options" style="display: none;">
          <label><input type="checkbox" data-level="1"> Nível 1</label>
          <label><input type="checkbox" data-level="3"> Nível 3</label>
          <label><input type="checkbox" data-level="5"> Nível 5</label>
        </div>
      </div>
    </div>
  </div>

  <div class="spells-content">
    <ul id="spells-list" class="spells-list"></ul>
  </div>

</div>

<!-- =========================
     Spell Detail Modal
========================= -->

<div id="spell-detail-overlay" class="spell-detail-overlay"></div>

<div id="spell-detail-modal" class="spell-detail-modal">
  
  <div class="spell-detail-header">
    <h2 id="spell-detail-title">Detalhes da Magia</h2>
    <button id="spell-detail-close" class="spell-detail-close">✕</button>
  </div>

  <div class="spell-detail-content">
    <div class="spell-detail-section">
      <span class="spell-detail-label">Custo</span>
      <span id="spell-detail-cost" class="spell-detail-value"></span>
    </div>
    
    <div class="spell-detail-section">
      <span class="spell-detail-label">Escola</span>
      <span id="spell-detail-school" class="spell-detail-value"></span>
    </div>
    
    <div class="spell-detail-section">
      <span class="spell-detail-label">Nível</span>
      <span id="spell-detail-level" class="spell-detail-value"></span>
    </div>
    
    <div class="spell-detail-tags" id="spell-detail-tags"></div>
    
    <div class="spell-detail-description">
      <p id="spell-detail-description"></p>
    </div>
  </div>

</div>
